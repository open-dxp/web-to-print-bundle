framework:
    messenger:
        routing:
            'OpenDxp\Bundle\WebToPrintBundle\Messenger\GenerateWeb2PrintPdfMessage': opendxp_core
opendxp:
    documents:
        type_definitions:
            map:
                printpage:
                    class: \OpenDxp\Bundle\WebToPrintBundle\Model\Document\Printpage
                    children_supported: false
                    direct_route: true
                    predefined_document_types: true
                printcontainer:
                    class: \OpenDxp\Bundle\WebToPrintBundle\Model\Document\Printcontainer
                    only_printable_childrens: true
                    direct_route: true
                    predefined_document_types: true
